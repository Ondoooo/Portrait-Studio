<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="324" viewBox="0 0 800 324">
 <title>White shirt repair, anonymous comparison</title>
 <desc>Four flat-laid shirts in the upper row and the same area of each shirt at drawing resolution below.</desc>
 <defs>
  <linearGradient id="fabric" x1="0" y1="0" x2="1" y2=".8" gradientUnits="objectBoundingBox">
   <stop stop-color="#f3f2ef"/><stop offset=".55" stop-color="#e3e2df"/><stop offset="1" stop-color="#cfceca"/>
  </linearGradient>
  <pattern id="weave" patternUnits="userSpaceOnUse" width="4" height="4">
   <path d="M0 0h4M0 2h4" stroke="#fff" stroke-width=".65" opacity=".33"/>
   <path d="M1 0v4" stroke="#625f5c" stroke-width=".65" opacity=".13"/>
  </pattern>
  <filter id="f1" x="-20%" y="-80%" width="140%" height="260%"><feGaussianBlur stdDeviation="2.6"/></filter>
  <filter id="f2" x="-20%" y="-80%" width="140%" height="260%"><feGaussianBlur stdDeviation="5"/></filter>
  <radialGradient id="fade"><stop offset=".60" stop-color="white"/><stop offset="1" stop-color="black"/></radialGradient>
  <mask id="patch" maskUnits="userSpaceOnUse" x="50" y="84" width="216" height="96">
   <ellipse cx="158" cy="132" rx="105" ry="47" fill="url(#fade)"/>
  </mask>
  <path id="outline" d="M112 14 Q141 28 179 14 L208 20 269 57 246 97 212 81 220 211 Q156 226 87 211 L92 81 58 97 35 57 95 21Z"/>
  <clipPath id="shirtClip"><use xlink:href="#outline"/></clipPath>
  <g id="stitches" fill="none" stroke="#a9a8a2" stroke-width="1.6">
   <path d="M113 15 Q139 54 177 15M116 16 Q141 46 174 16M88 207 Q157 219 218 207M59 90l30-14M218 76l30 14"/>
  </g>
  <g id="cotton"><rect width="310" height="230" fill="url(#fabric)"/><rect width="310" height="230" fill="url(#weave)"/></g>
  <g id="folds" fill="none" stroke-linecap="round">
   <g filter="url(#f1)">
    <path d="M90 121 Q119 104 157 112 T215 101" stroke="#92918e" stroke-width="6" opacity=".62"/>
    <path d="M89 116 Q119 101 157 108 T215 98" stroke="#fff" stroke-width="5" opacity=".80"/>
    <path d="M88 142 Q121 151 152 136 T219 132" stroke="#8e8e8b" stroke-width="7" opacity=".62"/>
    <path d="M89 138 Q121 146 152 132 T219 128" stroke="#fff" stroke-width="5" opacity=".74"/>
    <path d="M101 167 Q127 148 158 153 T210 145" stroke="#999994" stroke-width="4" opacity=".66"/>
   </g>
  </g>
  <g id="base"><rect width="310" height="230" fill="#737b78"/><use xlink:href="#outline" fill="#d9d8d5"/>
   <g clip-path="url(#shirtClip)"><use xlink:href="#cotton"/><use xlink:href="#folds"/><use xlink:href="#stitches"/></g>
  </g>
  <g id="p1"><use xlink:href="#base"/><g clip-path="url(#shirtClip)"><g mask="url(#patch)">
   <use xlink:href="#cotton"/><use xlink:href="#folds" transform="translate(0,1.7)"/><rect width="310" height="230" fill="#fdfcf8" opacity=".18"/>
  </g></g></g>
  <g id="p2"><use xlink:href="#base"/><g clip-path="url(#shirtClip)"><g mask="url(#patch)">
   <use xlink:href="#cotton"/><use xlink:href="#folds" filter="url(#f2)" opacity=".78"/>
  </g></g></g>
  <g id="p3"><use xlink:href="#base"/><g clip-path="url(#shirtClip)"><g mask="url(#patch)">
   <use xlink:href="#cotton"/><use xlink:href="#folds" opacity=".70"/>
   <path d="M100 146 Q125 148 152 136 T211 132" fill="none" stroke="#999893" stroke-width="2.7"/>
  </g></g></g>
 </defs>
 <rect width="800" height="324" fill="#25292a"/>
 <g font-family="sans-serif" font-size="14" fill="#fff">
  <text x="8" y="19">Original reference</text><text x="208" y="19">A</text><text x="408" y="19">B</text><text x="608" y="19">C</text>
  <text x="8" y="189">Registered detail, 1 drawing unit per pixel at the board's original size</text>
 </g>
 <use xlink:href="#base" transform="translate(8,28) scale(.59)"/>
 <use xlink:href="#p1" transform="translate(208,28) scale(.59)"/>
 <use xlink:href="#p2" transform="translate(408,28) scale(.59)"/>
 <use xlink:href="#p3" transform="translate(608,28) scale(.59)"/>
 <svg x="8" y="202" width="184" height="108" viewBox="63 79 184 108"><use xlink:href="#base"/></svg>
 <svg x="208" y="202" width="184" height="108" viewBox="63 79 184 108"><use xlink:href="#p1"/></svg>
 <svg x="408" y="202" width="184" height="108" viewBox="63 79 184 108"><use xlink:href="#p2"/></svg>
 <svg x="608" y="202" width="184" height="108" viewBox="63 79 184 108"><use xlink:href="#p3"/></svg>
</svg>
